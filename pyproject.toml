[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-guard"
version = "0.7.0.dev0"
description = "RVguarder: an OpenClaw agent plugin for pre-execution approval, PMKB authorization modeling, and runtime verification."
requires-python = ">=3.13"
authors = [
  { name = "Codex" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "python-dotenv",
  "requests",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
openclaw-guard = "clawRVguarder.main:main"
dsh-rvguarder = "clawRVguarder.hosts.dsh.server:main"

[project.optional-dependencies]
web = []
postgres = ["psycopg2-binary", "sqlalchemy[asyncio]>=2.0"]
redis = ["redis>=5.0"]
test = ["httpx"]

[tool.setuptools.packages.find]
include = ["clawRVguarder*"]

[tool.setuptools.package-data]
"clawRVguarder.rv" = ["rv_rules.json", "profiles/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
